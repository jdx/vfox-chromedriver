name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Install plugin from tested commit
        shell: bash
        env:
          PLUGIN_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mise plugin install -f vfox-mise-plugins-vfox-chromedriver \
            "https://github.com/mise-plugins/vfox-chromedriver.git#$PLUGIN_REF"

      - name: Install chromedriver using vfox plugin from GitHub
        run: |
          mise install "vfox:mise-plugins/vfox-chromedriver@131.0.6778.69"

      - name: Test chromedriver
        run: |
          mise x "vfox:mise-plugins/vfox-chromedriver@131.0.6778.69" -- chromedriver --version

      - name: Test latest version resolution
        shell: bash
        run: |
          node <<'NODE'
          const { execFileSync } = require("node:child_process");

          async function main() {
            const response = await fetch(
              "https://googlechromelabs.github.io/chrome-for-testing/known-good-versions-with-downloads.json",
            );
            const data = await response.json();
            const expected = data.versions.filter((version) => version.downloads?.chromedriver).at(-1).version;
            const actual = execFileSync(
              "mise",
              ["latest", "vfox:mise-plugins/vfox-chromedriver"],
              { encoding: "utf8" },
            ).trim();

            if (actual !== expected) {
              throw new Error(`expected latest ChromeDriver ${expected}, got ${actual}`);
            }
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
